<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="../../../dist/umd/super-chart.js"></script>
    <script type="text/javascript" src="../../js/dataSource.js"></script>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Drawings subsystem — tool harness</title>
    <style>
      body { display: flex; margin: 0; font-family: -apple-system, sans-serif; background: #131722; color: #d1d4dc; }
      #sidebar { width: 280px; height: 100vh; overflow-y: auto; padding: 8px; box-sizing: border-box; border-right: 1px solid #2a2e39; font-size: 12px; }
      #chart { flex: 1; height: 100vh; }
      .group { margin-bottom: 10px; }
      .group h4 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; color: #787b86; }
      .tools { display: flex; flex-wrap: wrap; gap: 3px; }
      .tools button { background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39; border-radius: 3px; padding: 4px 7px; font-size: 11px; cursor: pointer; }
      .tools button:hover { background: #2a2e39; }
      .tools button.active { background: #2962ff; border-color: #2962ff; }
      .tools button.na { opacity: 0.35; }
      .section-label { margin-top: 4px; font-size: 10px; color: #565b66; }
      #actions { margin-top: 12px; padding-top: 8px; border-top: 1px solid #2a2e39; }
      #actions button { width: 100%; margin: 2px 0; background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39; border-radius: 3px; padding: 5px; font-size: 11px; cursor: pointer; }
      #log { margin-top: 8px; font-size: 10px; color: #787b86; max-height: 140px; overflow-y: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="sidebar">
      <div id="palette"></div>
      <div id="actions">
        <button onclick="deselect()">Deselect (Esc)</button>
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button onclick="clearAll()">Clear all drawings</button>
        <button onclick="listDrawings()">console: list()</button>
        <button onclick="seedDrawings()">seed: line + hline + fib</button>
      </div>
      <div id="log"></div>
    </div>
    <div id="chart"></div>
    <script>
      var chart = superChart.init('chart')
      chart.createIndicator('MA')
      chart.applyNewData(generated())
      var d = chart.drawings
      var logEl = document.getElementById('log')
      function log (msg) { logEl.textContent = msg + '\n' + logEl.textContent }
      window.chart = chart
      window.d = d

      // Tool palette from the catalog — unavailable entries render dimmed.
      var palette = document.getElementById('palette')
      var activeBtn = null
      d.catalog().forEach(function (group) {
        var g = document.createElement('div')
        g.className = 'group'
        g.innerHTML = '<h4>' + group.id + '</h4>'
        group.sections.forEach(function (section) {
          var lbl = document.createElement('div')
          lbl.className = 'section-label'
          lbl.textContent = section.id
          g.appendChild(lbl)
          var row = document.createElement('div')
          row.className = 'tools'
          section.items.forEach(function (item) {
            var b = document.createElement('button')
            b.textContent = item.title
            b.title = item.id + ' → ' + item.overlayName
            if (!item.available) b.className = 'na'
            b.onclick = function () {
              if (!item.available) { log('n/a: ' + item.id); return }
              var id = d.activate(item.id)
              log('activate ' + item.id + ' → ' + JSON.stringify(id))
              if (activeBtn) activeBtn.classList.remove('active')
              activeBtn = b; b.classList.add('active')
            }
            row.appendChild(b)
          })
          g.appendChild(row)
        })
        palette.appendChild(g)
      })

      d.on('select', function (e) { log('select ' + (e.overlay && e.overlay.id)) })
      d.on('toolChange', function (e) { log('tool → ' + e.tool) })

      function deselect () { d.deselect(); if (activeBtn) { activeBtn.classList.remove('active'); activeBtn = null } }
      function undo () { log('undo → ' + d.undo()) }
      function redo () { log('redo → ' + d.redo()) }
      function clearAll () { log('clear → ' + d.clear({})) }
      function listDrawings () { console.log(d.list({})); log('list → ' + d.list({}).length + ' drawings') }
      function seedDrawings () {
        var t0 = Date.now() - 86400000 * 30, t1 = Date.now() - 86400000 * 10
        d.addLine({ from: { time: t0, value: 13300 }, to: { time: t1, value: 14200 } })
        d.addHLine({ value: 14000 })
        d.addFibRetracement({ from: { time: t0, value: 13300 }, to: { time: t1, value: 14500 } })
        log('seeded 3')
      }
    </script>
  </body>
</html>
