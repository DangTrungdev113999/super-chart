<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="../../../dist/umd/super-chart.js"></script>
    <script type="text/javascript" src="../../js/dataSource.js"></script>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Drawings subsystem — tool harness</title>
    <style>
      body { display: flex; margin: 0; font-family: -apple-system, sans-serif; background: #131722; color: #d1d4dc; }
      #sidebar { width: 280px; height: 100vh; overflow-y: auto; padding: 8px; box-sizing: border-box; border-right: 1px solid #2a2e39; font-size: 12px; }
      #chart { flex: 1; height: 100vh; }
      .group { margin-bottom: 10px; }
      .group h4 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; color: #787b86; }
      .tools { display: flex; flex-wrap: wrap; gap: 3px; }
      .tools button { background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39; border-radius: 3px; padding: 4px 7px; font-size: 11px; cursor: pointer; }
      .tools button:hover { background: #2a2e39; }
      .tools button.active { background: #2962ff; border-color: #2962ff; }
      .tools button.na { opacity: 0.35; }
      .section-label { margin-top: 4px; font-size: 10px; color: #565b66; }
      #actions { margin-top: 12px; padding-top: 8px; border-top: 1px solid #2a2e39; }
      #actions button { width: 100%; margin: 2px 0; background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39; border-radius: 3px; padding: 5px; font-size: 11px; cursor: pointer; }
      #log { margin-top: 8px; font-size: 10px; color: #787b86; max-height: 140px; overflow-y: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="sidebar">
      <div id="palette"></div>
      <div id="actions">
        <button onclick="deselect()">Deselect (Esc)</button>
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button onclick="clearAll()">Clear all drawings</button>
        <button onclick="listDrawings()">console: list()</button>
        <button onclick="seedDrawings()">seed: line + hline + fib</button>
        <button onclick="seedMany(200)">perf: seed 200 drawings</button>
        <button onclick="toggleFps()">perf: FPS meter</button>
      </div>
      <div id="perf" style="margin-top:6px;font-size:11px;color:#9598a1"></div>
      <div id="log"></div>
    </div>
    <div id="chart"></div>
    <script>
      var chart = superChart.init('chart')
      chart.createIndicator('MA')
      // v10 fork uses an async DataLoader instead of applyNewData.
      var bars = generated()
      chart.setDataLoader({
        getBars: function (params) { params.callback(bars) }
      })
      chart.setSymbol({ ticker: 'FP_DEMO', pricePrecision: 2, volumePrecision: 0 })
      chart.setPeriod({ type: 'day', span: 1 })
      var d = chart.drawings
      var logEl = document.getElementById('log')
      function log (msg) { logEl.textContent = msg + '\n' + logEl.textContent }
      window.chart = chart
      window.d = d

      // Tool palette from the catalog — unavailable entries render dimmed.
      var palette = document.getElementById('palette')
      var activeBtn = null
      d.catalog().forEach(function (group) {
        var g = document.createElement('div')
        g.className = 'group'
        g.innerHTML = '<h4>' + group.id + '</h4>'
        group.sections.forEach(function (section) {
          var lbl = document.createElement('div')
          lbl.className = 'section-label'
          lbl.textContent = section.id
          g.appendChild(lbl)
          var row = document.createElement('div')
          row.className = 'tools'
          section.items.forEach(function (item) {
            var b = document.createElement('button')
            b.textContent = item.title
            b.title = item.id + ' → ' + item.overlayName
            if (!item.available) b.className = 'na'
            b.onclick = function () {
              if (!item.available) { log('n/a: ' + item.id); return }
              var id = d.activate(item.id)
              log('activate ' + item.id + ' → ' + JSON.stringify(id))
              if (activeBtn) activeBtn.classList.remove('active')
              activeBtn = b; b.classList.add('active')
            }
            row.appendChild(b)
          })
          g.appendChild(row)
        })
        palette.appendChild(g)
      })

      d.on('select', function (e) { log('select ' + (e.overlay && e.overlay.id)) })
      d.on('toolChange', function (e) { log('tool → ' + e.tool) })

      function deselect () { d.deselect(); if (activeBtn) { activeBtn.classList.remove('active'); activeBtn = null } }
      function undo () { log('undo → ' + d.undo()) }
      function redo () { log('redo → ' + d.redo()) }
      function clearAll () { log('clear → ' + d.clear({})) }
      function listDrawings () { console.log(d.list({})); log('list → ' + d.list({}).length + ' drawings') }
      function seedDrawings () {
        var t0 = Date.now() - 86400000 * 30, t1 = Date.now() - 86400000 * 10
        d.addLine({ from: { time: t0, value: 13300 }, to: { time: t1, value: 14200 } })
        d.addHLine({ value: 14000 })
        d.addFibRetracement({ from: { time: t0, value: 13300 }, to: { time: t1, value: 14500 } })
        log('seeded 3')
      }

      // ── perf helpers ────────────────────────────────────────────
      // Deterministic pseudo-random so repeat runs seed the same layout.
      function mulberry32 (a) {
        return function () {
          a |= 0; a = a + 0x6D2B79F5 | 0
          var t = Math.imul(a ^ a >>> 15, 1 | a)
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
          return ((t ^ t >>> 14) >>> 0) / 4294967296
        }
      }

      // Names picked to exercise every figure family: lines, rays,
      // channels, fibs, shapes, freehand (path), text, measure.
      var SEED_NAMES = [
        'segment', 'rayLine', 'straightLine', 'horizontalStraightLine',
        'priceLine', 'crossLine', 'verticalStraightLine', 'trendAngle',
        'parallelStraightLine', 'disjointChannel', 'flatTopBottom',
        'pitchfork', 'fibRetracement', 'fibExtension', 'fibChannel',
        'fibTimeZone', 'fibCircles', 'fibWedge', 'gannFan', 'gannBox',
        'rect', 'circle', 'ellipse', 'triangle', 'parallelogram',
        'rotatedRect', 'arc', 'doubleCurve', 'path', 'polyline',
        'measure', 'dateAndPriceRange', 'priceRange', 'dateRange',
        'forecast', 'longPosition', 'shortPosition', 'barsPattern',
        'cyclicLines', 'timeCycles', 'sineLine', 'headAndShoulders',
        'elliottImpulse', 'xabcd', 'threeDrives', 'text', 'callout',
        'note', 'priceNote', 'signpost', 'table', 'flagMark',
        'arrowMarkUp', 'arrowMarkDown', 'arrowLine', 'regressionTrend',
        'anchoredText', 'anchoredNote', 'priceLabel', 'comment'
      ]

      function seedMany (n) {
        var rnd = mulberry32(42)
        var day = 86400000
        var now = Date.now()
        var added = 0
        for (var i = 0; i < n; i++) {
          var name = SEED_NAMES[i % SEED_NAMES.length]
          var t0 = now - day * (5 + Math.floor(rnd() * 60))
          var t1 = t0 + day * (1 + Math.floor(rnd() * 20))
          var v0 = 12000 + rnd() * 4000
          var v1 = 12000 + rnd() * 4000
          var points = [
            { timestamp: t0, value: v0 },
            { timestamp: t1, value: v1 }
          ]
          // 3-point tools get a third anchor; elliott get more.
          if (/pitchfork|Channel|fibChannel|flatTopBottom|triangle|arc|curve|threeDrives|headAndShoulders|abcd|parallelogram|rotatedRect|ellipse|timeCycles/.test(name)) {
            points.push({ timestamp: t0 + day * 3, value: v0 + (v1 - v0) * 0.5 + 300 })
          }
          if (/elliottImpulse|xabcd|cypher/.test(name)) {
            points.push({ timestamp: t0 + day * 6, value: v1 - 500 })
            points.push({ timestamp: t0 + day * 9, value: v1 + 400 })
            points.push({ timestamp: t0 + day * 12, value: v0 + 600 })
            points.push({ timestamp: t0 + day * 15, value: v1 })
          }
          try {
            var overlay = chart.createOverlay({ name: name, points: points })
            if (overlay !== null && overlay !== undefined) added++
          } catch (e) {
            log('seed fail ' + name + ': ' + e.message)
          }
        }
        log('seeded ' + added + ' / ' + n + ' drawings')
      }

      var fpsTimer = null
      function toggleFps () {
        var el = document.getElementById('perf')
        if (fpsTimer !== null) {
          cancelAnimationFrame(fpsTimer)
          fpsTimer = null
          el.textContent = ''
          return
        }
        var frames = 0
        var last = performance.now()
        var worst = 0
        var tick = function () {
          var now2 = performance.now()
          var dt = now2 - last
          last = now2
          frames++
          if (dt > worst) worst = dt
          if (frames % 30 === 0) {
            el.textContent = 'fps ' + Math.round(1000 / (dt)) +
              ' | frame ' + dt.toFixed(1) + 'ms | worst ' + worst.toFixed(1) + 'ms' +
              ' | drawings ' + d.list({}).length
            worst = 0
          }
          fpsTimer = requestAnimationFrame(tick)
        }
        fpsTimer = requestAnimationFrame(tick)
        log('FPS meter on — pan/zoom the chart')
      }
    </script>
  </body>
</html>
